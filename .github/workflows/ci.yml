name: build-and-test
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StickerForge.sln
      - run: dotnet build StickerForge.sln --configuration Release --no-restore
      - run: dotnet test StickerForge.sln --configuration Release --no-build --no-restore
